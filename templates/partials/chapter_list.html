{% load static %}<div class="chapter-list">{% for c in chapters %}<a class="chapter-row" href="{% url 'webui_doc:chapter' c.slug %}"><span class="chapter-number">{{ c.number }}</span><img src="{% static c.cover %}" alt="" width="86" height="129" loading="lazy"><div class="chapter-row-copy"><span class="eyebrow">{{ c.category }}</span><h3>{{ c.title }}</h3><p>{{ c.summary }}</p></div><span class="row-arrow" aria-hidden="true">↗</span></a>{% endfor %}</div>
