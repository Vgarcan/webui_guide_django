<dialog class="search-dialog" id="guide-search" aria-labelledby="search-heading"><div class="dialog-top"><h2 id="search-heading">Find your next step</h2><button data-search-close aria-label="Close search">×</button></div><label class="visually-hidden" for="search-input">Search chapter titles and topics</label><input type="search" id="search-input" placeholder="Try Docker, VRAM or system prompts…" autocomplete="off"><p class="search-hint">Search chapter titles and section headings</p><div id="search-results" aria-live="polite"></div><template id="search-data">{% for c in chapters %}<a href="{% url 'webui_doc:chapter' c.slug %}" data-search-text="{{ c.title }} {{ c.summary }} {% for section in c.sections %}{{ section.title }} {% endfor %}"><span>{{ c.number }}</span><strong>{{ c.title }}</strong><small>{{ c.summary }}</small></a>{% endfor %}</template></dialog>
